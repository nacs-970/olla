[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olla"
version = "0.1.0"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: POSIX",
]
dependencies = [
    "ollama>=0.6.2",
    "click>=8.1,<9",
    "rich>=13",
    "httpx>=0.27.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
olla = "olla.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
